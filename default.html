<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% if page.title %}{{ page.title | escape }} | {% endif %}Musaydul Islam Khan</title>
<meta name="description" content="{{ page.description | default: 'Writings by Musaydul Islam Khan, Biotechnology and Genetic Engineering graduate.' | escape }}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8C%84%3C/text%3E%3C/svg%3E">
<style>
:root{--top:#2b3a67;--bot:#e8a3a0;--ink:#fff;--card:rgba(10,14,32,.38);--line:rgba(255,255,255,.3);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--top);line-height:1.7;transition:color 1s}
#sky{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,var(--top),var(--bot))}
header,main,footer{max-width:760px;margin:0 auto;padding:0 22px}
header{display:flex;flex-wrap:wrap;gap:6px 0;justify-content:space-between;align-items:center;padding-top:22px;padding-bottom:22px}
h1,h2,h3,header strong{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-weight:500}
header strong{font-size:1.25rem}
header a,footer a{color:inherit}
header nav a{text-decoration:none;margin-left:16px}
header a:hover,header a:focus-visible{text-decoration:underline}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px;margin:0 0 34px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
h1{font-size:clamp(2rem,6vw,3rem);line-height:1.1;letter-spacing:-.02em;margin:0 0 8px}
h2{font-size:clamp(1.6rem,4.5vw,2.2rem);margin:0 0 16px}
.meta{opacity:.85;margin:0 0 24px}
.panel a{color:inherit;text-underline-offset:3px}
.post h2,.post h3{margin:28px 0 10px}
.post p,.post li{max-width:68ch}
.post img{max-width:100%;height:auto;border-radius:12px}
.post pre{overflow-x:auto;padding:14px;border-radius:12px;background:rgba(0,0,0,.35);color:#fff}
.post code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em}
.post blockquote{margin:16px 0;padding:2px 18px;border-left:3px solid var(--line)}
.post table{display:block;overflow-x:auto;border-collapse:collapse}
.post th,.post td{border:1px solid var(--line);padding:6px 10px}
.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.rows li{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 20px;padding:16px 2px;border-bottom:1px solid var(--line)}
.rows h3{font-size:1.25rem;margin:0}
.rows span{opacity:.85}
footer{padding-top:6px;padding-bottom:28px}
footer a{margin-right:18px}
:focus-visible{outline:2px solid currentColor;outline-offset:3px}
</style>
</head>
<body>
<div id="sky"></div>
<header><strong><a href="/" style="text-decoration:none">Musayd</a></strong><nav aria-label="Site"><a href="/">Home</a><a href="/writings/">Writings</a></nav></header>
{{ content }}
<footer><a href="/">Home</a><a href="/writings/">All writings</a></footer>
<script>
// same sky colours as the home page, driven by the visitor's clock
var K=[[5,[59,74,122],[242,184,162]],[7,[255,184,107],[255,227,179]],[12,[74,163,232],[207,234,255]],[15.5,[107,179,217],[255,233,184]],[18,[91,75,138],[255,138,92]],[20.5,[20,26,58],[58,58,110]],[23.5,[5,6,15],[19,26,58]],[29,[59,74,122],[242,184,162]]];
function mix(a,b,t){return a.map(function(v,n){return Math.round(v+(b[n]-v)*t)})}
function rgb(c){return 'rgb('+c.join(',')+')'}
function paint(){
 var d=new Date(),h=d.getHours()+d.getMinutes()/60,hh=h<5?h+24:h,i=0;
 while(i<K.length-2&&hh>=K[i+1][0])i++;
 var a=K[i],b=K[i+1],t=(hh-a[0])/(b[0]-a[0]),top=mix(a[1],b[1],t),bot=mix(a[2],b[2],t);
 var lum=(0.299*(top[0]+bot[0])+0.587*(top[1]+bot[1])+0.114*(top[2]+bot[2]))/2,light=lum>150,s=document.documentElement.style;
 s.setProperty('--top',rgb(top));s.setProperty('--bot',rgb(bot));
 s.setProperty('--ink',light?'#10243a':'#ffffff');
 s.setProperty('--card',light?'rgba(255,255,255,.55)':'rgba(10,14,32,.38)');
 s.setProperty('--line',light?'rgba(16,36,58,.25)':'rgba(255,255,255,.3)');
}
paint();setInterval(paint,60000);
</script>
</body>
</html>
